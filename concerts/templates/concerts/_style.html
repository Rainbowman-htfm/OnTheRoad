<style>
/* Shared by the band page and the widget; the widget changes the variables from its settings */
:root { --bg: #fff; --fg: #111; --line: rgba(127, 127, 127, .25); --accent: #111; --on-accent: #fff; --radius: 6px; --font: system-ui, sans-serif; --pad: .7rem; --cancelled: #c22; }
/* A lighter red on dark: #c22 would be under the 4.5:1 contrast text needs */
:root[data-theme="dark"] { --bg: #161616; --fg: #eee; --accent: #eee; --on-accent: #111; --cancelled: #f66; }
:root[data-theme="transparent"] { --bg: transparent; }
:root.compact { --pad: .35rem; }
body { font-family: var(--font); color: var(--fg); background: var(--bg); line-height: 1.4; }
[hidden] { display: none !important; }
/* Read by screen readers only: which concert a ticket link is for, among many */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
a { color: inherit; }
.muted, .details, .tile .m { opacity: .7; }
.near { font: inherit; color: var(--accent); background: none; border: 1px solid var(--accent); border-radius: var(--radius); padding: .25rem .7rem; cursor: pointer; }
.concerts { list-style: none; padding: 0; margin: 0; }
.concert { display: flex; gap: .8rem; align-items: center; padding: var(--pad) 0; border-bottom: 1px solid var(--line); }
.tile { width: 3rem; flex: none; text-align: center; border: 1px solid var(--line); border-radius: var(--radius); padding: .25rem 0; }
.tile .d { display: block; font-size: 1.3rem; font-weight: 700; line-height: 1; }
.tile .m { display: block; font-size: .7rem; text-transform: uppercase; }
.info { flex: 1; }
.venue { display: block; }
.details span:not(:first-child):not(:empty)::before { content: " · "; }
.action { flex: none; }
.time { white-space: nowrap; }
/* "Pay what you can" on one line, its link underneath */
.entry { font-size: .85em; white-space: nowrap; }
.entry a { display: block; }
.tickets { display: inline-block; background: var(--accent); color: var(--on-accent); border-radius: var(--radius); padding: .3rem .8rem; text-decoration: none; }
/* Dimmed, but still readable: at .5 the text fell under 4.5:1 */
.cancelled .venue, .cancelled .details { text-decoration: line-through; opacity: .6; }
.status-cancelled { color: var(--cancelled); font-weight: 600; }
.new { font-size: .7em; font-weight: 600; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: var(--radius); padding: 0 .3em; vertical-align: .15em; }
.credit { font-size: .75em; opacity: .7; }
/* The venue of a named event, on its own line under the event's name: secondary */
.at { display: block; font-size: .85em; font-weight: normal; opacity: .7; }
.moved { display: block; font-size: .85em; font-weight: 600; color: var(--accent); }
/* Wide space: venue, city, time, other bands and distance line up in columns. The venue and the other
   bands share what is left, about 11rem each at full width; minmax(0, …) lets them shrink rather than push
   the row wider, so every row keeps the same columns */
@media (min-width: 900px) {
  .info { display: grid; grid-template-columns: minmax(0, 1fr) 9rem 8rem minmax(0, 1fr) 4rem; align-items: center; gap: .8rem; }
  .venue { display: inline; }
  .details { display: contents; opacity: 1; }
  .details span { opacity: .7; }
  .cancelled .details span { opacity: 1; }  /* already dimmed by its row: not twice */
  .details span::before { content: none !important; }
  .action { width: 8rem; text-align: right; }
}
</style>
