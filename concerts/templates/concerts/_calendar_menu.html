{# One button, the choices underneath: no JavaScript but the address selected for copying #}
<details class="calendar"><summary>Add to my calendar<span class="sr">: {{ calendar.band }}</span></summary>
<ul>
  <li><a href="{{ calendar.apple }}">Apple Calendar</a></li>
  <li><a href="{{ calendar.google }}" rel="noopener">Google Calendar</a></li>
  <li><a href="{{ calendar.outlook }}" rel="noopener">Outlook</a></li>
  <li><label>Other apps, copy this address:<input readonly value="{{ calendar.feed }}" onfocus="this.select()"></label></li>
</ul>
</details>
