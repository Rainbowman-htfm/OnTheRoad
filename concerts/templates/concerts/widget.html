<!doctype html>
<html lang="en" data-theme="{{ style.theme }}" style="{{ style.css }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ band.name }} – upcoming concerts</title>
<meta name="robots" content="noindex">
{% include "concerts/_style.html" %}
<style>
body { margin: 0; padding: .25rem .75rem; }
.all { display: block; padding: .6rem 0 .3rem; color: var(--accent); text-decoration: none; }
</style>
{{ choices|json_script:"choices" }}
<script>
// The band's style is the starting point; settings from the address override it,
// e.g. ?theme=dark&accent=c4161c&dates=3. Anything unexpected is ignored.
(function () {
  var params = new URLSearchParams(location.search), root = document.documentElement;
  var choices = JSON.parse(document.getElementById("choices").textContent);
  function color(name) {
    var value = params.get(name);
    return value && /^[0-9a-f]{6}$/i.test(value) ? "#" + value : null;
  }
  function isLight(hex) {
    var n = parseInt(hex.slice(1), 16);
    return 0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255) > 150;
  }
  if (["light", "dark", "transparent"].indexOf(params.get("theme")) >= 0) {
    root.dataset.theme = params.get("theme");
    // The band's background and text colours were chosen for its own theme: a theme in the address replaces
    // them. Its accent colour stays, unless the address gives one too.
    root.style.removeProperty("--bg");
    root.style.removeProperty("--fg");
  }
  var accent = color("accent"), text = color("text");
  if (accent) {
    root.style.setProperty("--accent", accent);
    root.style.setProperty("--on-accent", isLight(accent) ? "#111" : "#fff");
  }
  if (text) root.style.setProperty("--fg", text);
  if (choices.font.hasOwnProperty(params.get("font"))) root.style.setProperty("--font", choices.font[params.get("font")]);
  if (choices.corners.hasOwnProperty(params.get("corners"))) root.style.setProperty("--radius", choices.corners[params.get("corners")]);
  if (params.get("compact") === "on") root.classList.add("compact");
  if (params.get("near") === "off") root.dataset.near = "off";
  var max = parseInt(params.get("dates"), 10);
  window.limitRows = function () {
    if (!(max > 0)) return;
    Array.from(document.querySelectorAll("#concerts > li")).forEach(function (row, i) { row.hidden = i >= max; });
  };
})();
</script>
</head>
<body>
{% if concerts %}
<p><button class="near" id="near" type="button" hidden>📍 Near me</button> <span id="near-message" class="muted"></span></p>
{% include "concerts/_concert_list.html" with new_tab=True %}
{% else %}
<p class="muted">No upcoming concerts.</p>
{% endif %}
<a class="all" href="{{ page_url }}" target="_blank" rel="noopener">All dates →</a>
{% include "concerts/_near_me.html" %}
<script>
// Show only the first dates, then tell the band's page how tall the widget is
(function () {
  window.limitRows();
  function sendHeight() {
    // The body's own height, so the widget can also shrink (the page's height never goes below the iframe's)
    parent.postMessage({type: "otr-height", height: Math.ceil(document.body.getBoundingClientRect().height)}, "*");
  }
  new ResizeObserver(sendHeight).observe(document.body);
})();
</script>
</body>
</html>
